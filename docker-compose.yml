version: '3.8'

services:
  dispatcher:
    build: ./services/dispatcher
    container_name: ecommerce-dispatcher
    ports:
      - "${DISPATCHER_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=${NODE_ENV:-development}
    networks:
      - public-network
      - internal-network
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  auth-service:
    build: ./services/auth-service
    container_name: ecommerce-auth
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017
      - INTERNAL_KEY=${INTERNAL_KEY:-default-internal-key}
      - JWT_SECRET=${JWT_SECRET:-default-jwt-secret}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=${NODE_ENV:-development}
    networks:
      - internal-network
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  product-service:
    build: ./services/product-service
    container_name: ecommerce-product
    environment:
      - PORT=3002
      - MONGODB_URI=mongodb://mongodb:27017
      - INTERNAL_KEY=${INTERNAL_KEY:-default-internal-key}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=${NODE_ENV:-development}
    networks:
      - internal-network
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  order-service:
    build: ./services/order-service
    container_name: ecommerce-order
    environment:
      - PORT=3003
      - MONGODB_URI=mongodb://mongodb:27017
      - INTERNAL_KEY=${INTERNAL_KEY:-default-internal-key}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=${NODE_ENV:-development}
    networks:
      - internal-network
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  mongodb:
    image: mongo:7
    container_name: ecommerce-mongodb
    volumes:
      - mongodb_data:/data/db
    networks:
      - internal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: ecommerce-grafana
    ports:
      - "${GRAFANA_PORT:-3100}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - public-network
      - internal-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ecommerce-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - internal-network
    restart: unless-stopped

volumes:
  mongodb_data:
  grafana_data:
  prometheus_data:

networks:
  public-network:
    driver: bridge
  internal-network:
    driver: bridge
    internal: true
